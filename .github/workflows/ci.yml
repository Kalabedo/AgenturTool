name: Qualität

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Großzügig: Die Rauchproben packen die Anwendung zweimal.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron braucht unter Linux einen X-Server, auch für das
      # versteckte Fenster, mit dem die PDFs entstehen. Ohne xvfb würden die
      # Rendertests stillschweigend übersprungen — genau die, die prüfen,
      # dass das Dokument noch aussieht wie festgehalten.
      - run: xvfb-run -a pnpm verify
        env:
          # Electrons eigene Sandbox braucht unprivilegierte
          # User-Namespaces, die auf den Runnern nicht überall offen sind.
          # Ohne diesen Schalter hinge es vom Abbild ab, ob die Rendertests
          # laufen — und das ist genau die Unschärfe, die sie beseitigen
          # sollen.
          ELECTRON_NO_SANDBOX: 'true'

      # Und einmal die Anwendung selbst, in der Form, in der sie
      # ausgeliefert wird.
      #
      # Das ist der Teil, den kein Unit-Test erreicht: ob der Paketbaum die
      # API und den Prisma-Client findet, ob die Migrationen über Electrons
      # eigenes Node laufen, ob ein PDF entsteht. Zuerst gegen den Baum,
      # dann gegen das fertig gepackte Programm — der zweite Lauf prüft,
      # was das Packen selbst noch verändert.
      - name: Rauchprobe (Paketbaum)
        run: |
          pnpm --filter @agentur-tool/desktop paket --nur-baum
          xvfb-run -a node apps/desktop/scripts/rauchprobe.mjs

      - name: Rauchprobe (gepackt)
        run: |
          pnpm --filter @agentur-tool/desktop exec electron-builder --linux dir
          xvfb-run -a node apps/desktop/scripts/rauchprobe.mjs \
            apps/desktop/release/linux-unpacked/agentur-tool

  # Ein Paket, das sich nicht mehr bauen lässt, soll vor dem Ausliefern
  # auffallen und nicht erst beim Ausliefern. Jede Plattform baut auf ihrer
  # eigenen: Die Prisma-Engines ließen sich über Kreuz laden, die nativen
  # Binärdateien von @node-rs/argon2 kommen dagegen über
  # plattformspezifische Optional-Dependencies, und pnpm installiert nur
  # die des Wirtssystems.
  paket:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            ziel: macOS arm64
          - os: macos-13
            ziel: macOS x64
          - os: windows-latest
            ziel: Windows
    name: Paket (${{ matrix.ziel }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Ohne Signierung: Die Zertifikate liegen nicht in jedem Lauf vor, und
      # geprüft werden soll hier, ob das Paket entsteht.
      - run: pnpm --filter @agentur-tool/desktop paket
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Dass das Paket entsteht, heißt noch nicht, dass es läuft — und die
      # Frage stellt sich je Plattform neu: Prisma lädt seine Engine für
      # macOS anders als für Windows. Geprüft wird der Baum, nicht das
      # fertige Programm: Dessen Pfad heißt auf jedem System anders, und
      # der Unterschied zwischen beiden ist unter Linux bereits geprüft.
      - name: Rauchprobe
        run: node apps/desktop/scripts/rauchprobe.mjs
