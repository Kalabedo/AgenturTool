name: Desktop-Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag und Hauptzweig prüfen
        run: |
          node apps/desktop/scripts/release-preflight.mjs
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Der Release-Commit gehört nicht zu origin/main." >&2
            exit 1
          }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm verify
        env:
          ELECTRON_NO_SANDBOX: 'true'

  macos:
    needs: verify
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    name: Signieren (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `notarytool` nimmt den App-Store-Connect-Schlüssel nur als Datei
      # entgegen (`--key`), und electron-builder reicht `APPLE_API_KEY`
      # unverändert dorthin weiter. Das Geheimnis enthält deshalb den
      # PEM-Inhalt der `.p8`, und hier entsteht daraus kurzzeitig eine Datei
      # neben dem Lauf — nicht im Arbeitsbaum, damit sie in kein Paket gerät.
      - name: Notarisierungsschlüssel bereitlegen
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Signieren, notarisieren und DMG bauen
        run: pnpm --filter @privatura/desktop paket --release
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Der Runner wird ohnehin verworfen. Der Schlüssel liegt trotzdem nur
      # so lange, wie er gebraucht wird — auch wenn der Bau abbricht.
      - name: Notarisierungsschlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Signatur, Notarisierung und Laufzeit prüfen
        shell: bash
        run: |
          set -euo pipefail
          DMG_COUNT="$(find apps/desktop/release -maxdepth 1 -name 'Privatura-*-${{ matrix.arch }}.dmg' | wc -l | tr -d ' ')"
          test "$DMG_COUNT" = 1
          DMG="$(find apps/desktop/release -maxdepth 1 -name 'Privatura-*-${{ matrix.arch }}.dmg' -print -quit)"
          hdiutil verify "$DMG"

          MOUNT_POINT="$RUNNER_TEMP/privatura-release-dmg"
          DATA_DIR="$RUNNER_TEMP/privatura-release-smoke"
          mkdir -p "$MOUNT_POINT" "$DATA_DIR"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_POINT" >/dev/null
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null || true' EXIT

          APP="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          node apps/desktop/scripts/rauchprobe.mjs "$APP" --data-dir "$DATA_DIR"
          node apps/desktop/scripts/rauchprobe.mjs "$APP" --data-dir "$DATA_DIR" --reopen

      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos-${{ matrix.arch }}
          path: apps/desktop/release/Privatura-*-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    needs: verify
    environment: release
    name: Microsoft-Store-Paket (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Microsoft signiert nach der Store-Zertifizierung. Dieses Artefakt
      # ist nur für den Upload in Partner Center, nicht für Direktdownloads.
      - name: AppX für Partner Center bauen
        run: pnpm --filter @privatura/desktop paket --store --release

      # Die Paketinstallation und ein echtes Store-Update sind zusätzliche
      # Freigabekriterien auf Windows 11; der Server-Runner prüft den Inhalt.
      - name: Paketinhalt und Laufzeit prüfen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem 'apps/desktop/release/Privatura-*-x64.appx')
          if ($packages.Count -ne 1) { throw "Erwartete genau ein Store-Paket, fand $($packages.Count)." }
          if (Get-ChildItem 'apps/desktop/release/Privatura-*-x64.exe') { throw 'Direkter Windows-Installer im Store-Release.' }
          $packageDir = Join-Path $env:RUNNER_TEMP 'Privatura-Store-Inhalt'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, $packageDir)
          [xml]$manifest = Get-Content (Join-Path $packageDir 'AppxManifest.xml') -Raw
          if ($manifest.Package.Identity.Name -cne $env:WINDOWS_STORE_IDENTITY_NAME) { throw 'Falsche Store-Identität.' }
          if ($manifest.Package.Identity.Publisher -cne $env:WINDOWS_STORE_PUBLISHER) { throw 'Falscher Store-Publisher.' }
          if ($manifest.Package.Identity.ProcessorArchitecture -ne 'x64') { throw 'Falsche Architektur.' }
          if ($manifest.Package.Applications.Application.EntryPoint -ne 'Windows.FullTrustApplication') { throw 'Full-trust-Einstieg fehlt.' }
          $dataDir = Join-Path $env:RUNNER_TEMP 'Privatura-Smoke'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $app = Join-Path $packageDir 'app/Privatura.exe'
          node apps/desktop/scripts/rauchprobe.mjs $app --data-dir $dataDir
          if ($LASTEXITCODE -ne 0) { throw 'Erste Rauchprobe fehlgeschlagen.' }
          node apps/desktop/scripts/rauchprobe.mjs $app --data-dir $dataDir --reopen
          if ($LASTEXITCODE -ne 0) { throw 'Rauchprobe nach Neustart fehlgeschlagen.' }

      - uses: actions/upload-artifact@v4
        with:
          name: store-upload-windows-x64
          path: apps/desktop/release/Privatura-*-x64.appx
          if-no-files-found: error

  draft:
    needs: [macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Für das Feed-Skript; die übrigen Schritte brauchen den Quellbaum nicht.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-macos-*
          path: dist
          merge-multiple: true
      - name: Prüfsummen erzeugen
        run: |
          cd dist
          sha256sum Privatura-*.dmg > SHA256SUMS

      # Die Datei, die die installierte Anwendung später abfragt. Sie liegt
      # dem Release bei, damit veröffentlichte Prüfsummen und Feed aus
      # demselben Lauf stammen; auf die Website kommt sie zuletzt und erst,
      # wenn die Pakete dort schon liegen (docs/RELEASE.md).
      - name: Updatefeed erzeugen
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node apps/desktop/scripts/updatefeed.mjs --dir dist --version "${TAG#v}"
          cat dist/updates.json
      - name: Entwurfs-Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$IS_DRAFT" != true ]; then
              echo "Release $TAG ist bereits veröffentlicht und wird nicht überschrieben." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --draft --generate-notes --title "Privatura $TAG" --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
